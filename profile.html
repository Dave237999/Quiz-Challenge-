<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Challenge - Profil (Mode Clair)</title>
    <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans selection:bg-amber-400 selection:text-slate-950">

    <header class="border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index-clair.html" class="text-xl sm:text-2xl font-black bg-gradient-to-r from-amber-500 to-indigo-600 bg-clip-text text-transparent flex items-center gap-1">
                    Quiz <span class="text-amber-500">⚡</span>
                </a>
                <span class="text-xs font-bold tracking-widest text-slate-500 uppercase border-l border-slate-300 pl-2">Challenge</span>
            </div>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="index.html" class="text-slate-600 hover:text-indigo-600 transition-colors">Accueil</a>
                <a href="categories.html" class="text-slate-600 hover:text-indigo-600 transition-colors">Catégories</a>
                <a href="leaderboard.html" class="text-slate-600 hover:text-indigo-600 transition-colors">Classement</a>
                <a href="challenge.html" class="text-slate-600 hover:text-indigo-600 transition-colors">Défis</a>
                <a href="profile.html" class="text-amber-600 font-semibold transition-colors">Profil</a>
            </nav>
            <div class="flex items-center gap-3">
                <!-- Lien vers le mode sombre -->
                <a href="profile-sombre.html" aria-label="Passer en mode sombre" class="p-2.5 rounded-full bg-slate-900/80 border border-slate-200 text-slate-700 hover:bg-slate-200 transition-all shadow-sm flex items-center justify-center">
                    <span class="text-lg">🌙</span>
                </a>
                
                <button id="menu-btn" class="md:hidden relative z-50 p-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 hover:bg-slate-200 flex items-center justify-center">
                    <svg id="menu-icon-svg" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden absolute top-20 left-0 w-full bg-white border-b border-slate-200 shadow-2xl py-4 px-6 space-y-3 z-40 transition-all">
            <a href="index.html" class="block px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-100 transition-colors text-base">Accueil</a>
            <a href="categories.html" class="block px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-100 transition-colors text-base">Catégories</a>
            <a href="leaderboard.html" class="block px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-100 transition-colors text-base">Classement</a>
            <a href="challenge.html" class="block px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-100 transition-colors text-base">Défis</a>
            <a href="profile.html" class="block px-4 py-3 rounded-xl bg-amber-50 text-amber-700 font-semibold text-base">Profil</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10 space-y-8">
        <!-- En-tête Profil -->
        <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col sm:flex-row items-center gap-6">
            <div class="w-24 h-24 rounded-full border-4 border-amber-400 overflow-hidden shadow-lg flex-shrink-0">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=faces" class="w-full h-full object-cover">
            </div>
            <div class="text-center sm:text-left space-y-1">
                <h1 class="text-2xl font-black text-slate-900">DaveDev</h1>
                <p class="text-xs text-slate-500">Membre depuis le 2026</p>
                <div class="pt-2">
                    <span class="inline-block bg-indigo-50 text-indigo-600 font-bold text-xs px-3 py-1 rounded-full border border-indigo-200">Niveau 9</span>
                </div>
            </div>
        </div>

        <!-- Statistiques détaillées -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-md text-center space-y-1">
                <span class="text-2xl font-black text-indigo-600">42</span>
                <span class="block text-xs text-slate-500 uppercase tracking-wider">Quiz joués</span>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-md text-center space-y-1">
                <span class="text-2xl font-black text-amber-500">1,850</span>
                <span class="block text-xs text-slate-500 uppercase tracking-wider">Score Total</span>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-md text-center space-y-1">
                <span class="text-2xl font-black text-emerald-600">84%</span>
                <span class="block text-xs text-slate-500 uppercase tracking-wider">Précision</span>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-200 mt-16 py-8 text-center text-xs text-slate-500">
        <p>©️ 2026 Quiz Challenge. Tous droits réservés.</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = mobileMenu.classList.toggle('hidden');
            menuBtn.innerHTML = !isOpen ? `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>` : `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>`;
        });
        window.addEventListener('click', () => {
            if (!mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.add('hidden');
                menuBtn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>`;
            }
        });
    </script>
</body>
</html>

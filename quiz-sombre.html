<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Challenge - En jeu</title>
    <link rel="stylesheet" href="dist/output.css">
    <style>
        #jokers-container {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            column-gap: 3rem !important;
        }
        #jokers-container button {
            background-color: #4F39F6 !important;
            color: #ffffff !important;
            border: none !important;
        }
        #jokers-container button:hover {
            background-color: #412de0 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans flex flex-col selection:bg-amber-400 selection:text-slate-950 transition-colors duration-200">

    <!-- En-tête simplifié pour le jeu -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="categories-sombre.html" class="flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-indigo-600">
                ← Quitter
            </a>
            <div class="flex items-center gap-2 text-sm font-bold">
                <span>⏱️ <span id="time-left">00:30</span></span>
            </div>
            <a href="quiz.html" aria-label="Passer en mode sombre" class="p-2.5 rounded-full bg-slate-100 border border-slate-200 text-slate-700 hover:bg-slate-200 transition-all shadow-sm flex items-center justify-center">
                    <span class="text-lg">☀️</span>
            </a>
        </div>
    </header>

    <!-- Zone de jeu principale -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <!-- Progression -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    <span id="category-name">Informatique</span>
                    <span id="question-counter">Question 1 / 10</span>
                </div>
                <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-600 h-full w-0 rounded-full transition-all duration-300"></div>
                </div>
            </div>

            <!-- Intitulé de la question -->
            <h2 id="question-text" class="text-lg sm:text-xl font-bold leading-snug">
                Chargement de la question...
            </h2>

            <!-- Options de réponses (Injectées dynamiquement par le JS) -->
            <div id="options-container" class="space-y-3">
                <!-- Les boutons de réponses s'afficheront ici automatiquement -->
            </div>

            <!-- Jokers & Actions -->
            <div id="jokers-container" class="grid grid-cols-2 gap-12 pt-2">
                <button id="joker-50" class="py-3 px-4 rounded-xl bg-[#4F39F6] hover:bg-[#412de0] text-white text-xs sm:text-sm font-semibold transition-all cursor-pointer">50/50</button>
                <button id="joker-skip" class="py-3 px-4 rounded-xl bg-[#4F39F6] hover:bg-[#412de0] text-white text-xs sm:text-sm font-semibold transition-all cursor-pointer">Passer</button>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="./js/main.js"></script>
    <script src="./js/questions.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/quiz.js"></script>
</body>
</html>
